url: ""
baseurl: ""

# Site settings
title: 하우스 고치미
email: your-email@domain.com
description: "집 고칠 일, 어디에 맡겨야 할지 막막할 때"

markdown: kramdown
permalink: pretty

sitemap: true

paginate: 12
paginate_path: "/repair/:num/"
permalink: pretty

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /repair/:title-:i_month:short_year:i_day
      _options:
        content:
          width: 1500
          height: 2500

jekyll-archives:
  enabled:
    - tags
  layout: archive
  permalinks:
    tag: '/region=:name/'

plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate


exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE