<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>
    {% if page.layout == 'archive' %}
        {% case page.title %}
            {% when 'daegu' %}작업사례 | 대구광역시
            {% when 'gangwon' %}작업사례 | 강원도
            {% when 'jeonbuk' %}작업사례 | 전라북도
            {% when 'jeonnam' %}작업사례 | 전라남도
            {% when 'gyeongbuk' %}작업사례 | 경상북도
            {% when 'gyeongnam' %}작업사례 | 경상남도
            {% when 'gwangju' %}작업사례 | 광주광역시
            {% when 'ulsan' %}작업사례 | 울산광역시
            {% when 'busan' %}작업사례 | 부산광역시
            {% when 'daejeon' %}작업사례 | 대전광역시
            {% when 'chungbuk' %}작업사례 | 충청북도
            {% when 'chungnam' %}작업사례 | 충청남도
            {% else %}작업사례 | {{ page.title }}
        {% endcase %}
    {% elsif page.title %}
        {{ page.title }}
    {% else %}
        {{ site.title }}
    {% endif %}
    </title>
    
    
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">


    <!-- Custom CSS & Bootstrap Core CSS - Uses Bootswatch Flatly Theme: http://bootswatch.com/flatly/ -->
    <link rel="stylesheet" href="{{ "/style.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts -->
    <link rel="stylesheet" href="{{ "/css/font-awesome/css/font-awesome.min.css" | prepend: site.baseurl }}">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href='https://fonts.googleapis.com/css?family=Kaushan+Script' rel='stylesheet' type='text/css'>
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic,700italic' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700' rel='stylesheet' type='text/css'>

    <link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">


    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
