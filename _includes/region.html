<section id="region" class="bg-light-gray">

    <div class="container">

        <div class="row">

            <div class="col-lg-12 text-center">

                <h2 class="section-heading">출장 지역</h2>

                <h3 class="section-subheading text-muted">
                    다양한 지역의 시공 사례를 확인해 보세요
                </h3>

            </div>

        </div>

        <div class="row">

            <div class="col-lg-12 text-center">

                <div id="service-map">

                    {% include map.svg %}

                    <div id="map-label"></div>

                </div>

            </div>

        </div>

    </div>

</section>

<div id="region-modal">

    <div class="modal-content">

        <button id="modal-close">&times;</button>

        <h3 id="modal-title"></h3>

        <div id="modal-posts"></div>

        <a id="modal-more" class="btn btn-primary">
            다른 시공 사례 보기
        </a>

    </div>

</div>
